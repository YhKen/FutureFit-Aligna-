<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Fit · How matching works</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="recruitment.css"><body data-page="method"><main id="method" class="social-main"></main><script>document.documentElement.lang=localStorage.getItem('aligna-lang')||'zh';</script><script src="shared.js"></script><script type="module">
import {tr} from './recruitment-ui.js';
function render(){document.querySelector('#method').innerHTML=`<p class="eyebrow">FUTURE FIT / METHOD</p><h1>${tr('每个建议，都要讲得清楚。','Every recommendation should make sense.','Setiap cadangan perlu jelas.')}</h1><section class="application-card"><h2>${tr('三种对照，分开看','Three comparisons, kept distinct','Tiga perbandingan berasingan')}</h2><ol><li>${tr('职业探索：923 个 O*NET 职业。RIASEC 兴趣形状为主；至少回答 3 项相关技能时，加入 20% 技能自评。人格、价值观和准备度用于探索追问，不作为 HR 排名或录用依据。','Career exploration: 923 O*NET occupations. Interest-pattern similarity leads; with at least 3 relevant skill answers, self-rated skills contribute 20%. Personality, values and readiness inform exploration, not HR ranking or hiring decisions.','Penerokaan kerjaya: 923 pekerjaan O*NET. Persamaan corak minat diutamakan; sekurang-kurangnya 3 jawapan kemahiran berkaitan memberi sumbangan 20%. Personaliti, nilai dan kesediaan membantu penerokaan, bukan pemeringkatan HR.')}</li><li>${tr('职位对照：技能别名归一化 + 加权覆盖。专业技能权重 2，协作技能权重 1。匹配权重除以全部要求权重，再乘 100。只识别明确技能及已登记别名；不能理解所有自由文本，HR 应以逗号或换行逐项填写技能。','Job comparison: skill alias normalisation plus weighted coverage. Skills weigh 2, collaboration skills 1. Matched weights / all requirement weights × 100. Only explicit skills and registered aliases are recognised; employers should list one skill per comma or line.','Perbandingan jawatan: penyeragaman alias kemahiran dan liputan berwajaran. Kemahiran berwajaran 2, kerjasama 1. Wajaran sepadan / semua wajaran × 100. Hanya kemahiran jelas dan alias berdaftar dikenal pasti; asingkan kemahiran dengan koma atau baris.')}</li><li>${tr('未来情景：基础参考分 + 透明的情景假设 + 有日期的行业新闻信号。新闻只表示近期关注，不证明招聘需求。没有数据时不加分，过期新闻不参与。','Future scenarios: baseline index plus transparent scenario assumptions and dated sector-news signals. News indicates recent attention, not hiring demand. Missing data adds no points; stale news is excluded.','Senario masa hadapan: indeks asas, andaian senario telus dan isyarat berita sektor bertarikh. Berita menunjukkan perhatian, bukan permintaan pengambilan. Data tiada tidak menambah mata; berita lama dikecualikan.')}</li></ol></section><section class="application-card"><h2>${tr('相似度、覆盖率和证据','Similarity, coverage and evidence','Persamaan, liputan dan bukti')}</h2><p>${tr('Job description 对照同时显示加权记录覆盖和 cosine similarity。把 Job description 专业技能编码为 2、协作项编码为 1；候选人有对应记录时，候选向量取同值，否则取 0。只在 Job description 已列出的维度内比较，额外技能不扣分；零向量不计算。','Job description comparisons show weighted record coverage and cosine similarity. Job description role skills are encoded as 2, collaboration items as 1. The candidate vector uses the same value when a matching record exists, otherwise 0. Only Job description-listed dimensions are compared; extra skills are not penalised. Zero vectors are not scored.','Perbandingan Job description menunjukkan liputan rekod berwajaran dan persamaan kosinus. Kemahiran jawatan dikodkan 2 dan kerjasama 1. Vektor calon mengambil nilai sama jika rekod sepadan wujud, selainnya 0. Hanya dimensi Job description dibandingkan; kemahiran tambahan tidak dihukum. Vektor sifar tidak diberi skor.')}</p><code>Cosine = J·C / (‖J‖ × ‖C‖)<br>J = [2, 2, 1] · C = [2, 0, 0] → cosine 67% · coverage 40%</code><p>${tr('两种数字来自同一批记录，并非独立验证。它们不是能力分数、可信度或录用概率。这套明确权重尚未按招聘结果校准；不能承诺 99% 准确。','Both figures use the same records, not independent validation. They are not ability scores, credibility ratings or hiring probabilities. These explicit weights have not been calibrated against hiring outcomes; 99% accuracy is not established.','Kedua-dua angka menggunakan rekod sama, bukan pengesahan bebas. Ia bukan skor kebolehan, kebolehpercayaan atau peluang diterima. Wajaran ini belum ditentukur dengan hasil pengambilan; ketepatan 99% belum dibuktikan.')}</p><p>${tr('每项对照保留 Job description 原词、归一化技能、候选人主动分享的原始技能名称与经历例子。HR 只看申请授权的职业资料，不能通过这里读取私人问卷或游戏记录。个人桑基图的线宽表示记录条数：CV 技能记录与相关自评各计一条；游戏单独连到练习节奏，不连到专业技能得分。','Each comparison retains the Job description term, normalised skill, and the original skill name and example the candidate chose to share. HR sees only consented application profile data, not private answers or games. Personal Sankey widths count records: one profile entry and one relevant skill rating each. Games connect separately to practice pacing, not professional-skill scores.','Setiap perbandingan mengekalkan istilah Job description, kemahiran dinormalkan serta nama dan contoh asal yang dipilih calon untuk dikongsi. HR hanya melihat profil permohonan berizin, bukan jawapan atau permainan peribadi. Lebar Sankey mengira rekod: satu entri profil dan satu penilaian kemahiran berkaitan. Permainan hanya dihubungkan kepada rentak latihan, bukan skor kemahiran profesional.')}</p><a href="https://scikit-learn.org/stable/modules/generated/sklearn.metrics.pairwise.cosine_similarity.html" target="_blank" rel="noopener">${tr('余弦相似度公式参考','Cosine similarity definition','Takrif persamaan kosinus')} ↗</a></section>
<section class="application-card"><h2>${tr('下一题怎么选','How the next question is selected','Cara soalan seterusnya dipilih')}</h2><p>${tr('当前技术是基于规则的自适应选题（evidence-routing-v2）：先保证兴趣、人格、技能、价值观与准备度的覆盖，再按回答差异、职业技能缺口和个人确认的技能挑选追问；同一题不会重复。它不是经过校准的 IRT/CAT，也不是训练完成的机器学习模型，不会在没有验证的情况下自动改变计分。','The current technique is rule-based adaptive routing (evidence-routing-v2): establish domain coverage, then prioritise response variation, career-related skill gaps and confirmed skills. Questions do not repeat. This is not calibrated IRT/CAT or a trained machine-learning model; scoring does not silently retrain.','Teknik semasa ialah pemilihan adaptif berasaskan peraturan (evidence-routing-v2): liputi domain dahulu, kemudian utamakan variasi jawapan, jurang kemahiran kerjaya dan kemahiran disahkan pengguna. Soalan tidak berulang. Ini bukan IRT/CAT terkalibrasi atau model pembelajaran mesin terlatih.')}</p></section><section class="application-card"><h2>${tr('资料可信到什么程度','What the evidence supports','Apa yang disokong oleh bukti')}</h2><p>${tr('邮箱验证只验证账号邮箱。自评是自评，经历例子是申请者提供的陈述，链接也不等于认证。这里显示证据覆盖和待确认项，不生成“诚实度”“撒谎概率”或人格决定的录用建议。','Email verification verifies an email account only. Self-ratings and experience examples are applicant claims; links are not certification. We show evidence coverage and open questions, not honesty scores, lie probabilities or personality-based hiring recommendations.','Pengesahan e-mel hanya mengesahkan akaun e-mel. Penilaian kendiri dan contoh pengalaman ialah dakwaan pemohon; pautan bukan pensijilan. Kami memaparkan liputan bukti, bukan skor kejujuran atau keputusan pengambilan berdasarkan personaliti.')}</p><p>${tr('两个游戏观察当前任务中的空间工作记忆表现、规则切换准确率和反应时间。设备、练习、疲劳及无障碍需求会影响结果。它们不测量神经活动，不诊断疾病、不测 IQ、不识别撒谎，也不进入 HR 匹配分。','The two games record spatial working-memory task performance, rule-switching accuracy and response time. Device, practice, fatigue and accessibility needs affect results. They do not measure neural activity, diagnose conditions, measure IQ or detect lies, and are excluded from HR matching.','Dua permainan merekod prestasi tugas ingatan ruang, ketepatan pertukaran peraturan dan masa tindak balas. Peranti, latihan, keletihan dan keperluan akses mempengaruhi hasil. Ia bukan ukuran aktiviti saraf, diagnosis, IQ atau pengesan bohong, dan tidak digunakan dalam padanan HR.')}</p></section><section class="application-card"><h2>${tr('三份记录如何合在一起','How the three sources work together','Cara tiga sumber digabungkan')}</h2><p>${tr('CV 在本机提取文字，再按明确标题和技能词填入档案。可修改、可增删；自动识别不认证学历或经验。支持最多 8 段教育、8 段经历和 35 项选中技能。','CV text is extracted on your device and mapped using explicit headings and skill terms. You can edit or remove entries. Extraction does not verify education or experience. Up to 8 education entries, 8 experience entries and 35 selected skills are supported.','Teks CV diekstrak pada peranti dan dipadankan menggunakan tajuk serta istilah kemahiran jelas. Entri boleh disunting atau dibuang. Pengekstrakan tidak mengesahkan pendidikan atau pengalaman. Sehingga 8 entri pendidikan, 8 pengalaman dan 35 kemahiran dipilih disokong.')}</p><p>${tr('职业顺序仍依据问卷兴趣和技能自评。档案中已有、但问卷未测到的相关技能，练习优先系数暂设为 0.9，仍标为待确认。游戏中位置命中或规则正确率低于 75%，或超时至少 3 次时，先建议每段练习 10 分钟，否则 20 分钟。这些是可调整的产品默认值，没有常模或验证结论；不会改变职业排序或 HR 技能覆盖率。','Career order still uses questionnaire interests and skill ratings. Profile skills without a questionnaire rating receive a provisional practice-priority multiplier of 0.9 and remain unassessed. Recall or rule accuracy below 75%, or at least 3 timeouts, suggests 10-minute practice blocks; otherwise 20 minutes. These adjustable product defaults have no normative validation and do not change career order or HR coverage.','Susunan kerjaya masih menggunakan minat dan laporan kemahiran. Kemahiran profil tanpa penilaian soalan diberi pengganda keutamaan latihan sementara 0.9 dan kekal belum dinilai. Ketepatan di bawah 75% atau sekurang-kurangnya 3 kehabisan masa mencadangkan blok latihan 10 minit; selainnya 20 minit. Nilai lalai produk ini boleh diubah dan belum disahkan secara normatif; tidak mengubah susunan kerjaya atau liputan HR.')}</p><p>${tr('个人工作要求采用逐项等权对照：明确符合项数 ÷ 已填写条件总数。未写明的 Job description 条件单独列为待确认，不当作符合；因此它是已确认覆盖，不是录用或适合概率。自由文字只识别明确词句，无法可靠推断未写出的公司文化。','Personal job criteria count equally: explicitly met criteria divided by all entered criteria. Unstated Job description conditions remain unconfirmed rather than matched. This is confirmed coverage, not hiring or fit probability. Free text uses explicit phrases and cannot establish unwritten company culture.','Kriteria kerja peribadi sama wajaran: kriteria dipenuhi secara jelas dibahagi semua kriteria diisi. Syarat Job description tidak dinyatakan kekal belum disahkan, bukan sepadan. Ini liputan disahkan, bukan kebarangkalian diterima atau kesesuaian. Teks bebas menggunakan frasa jelas dan tidak boleh menentukan budaya syarikat yang tidak dinyatakan.')}</p></section><section class="application-card"><h2>${tr('从 Job description 缺项到学习路线','From Job description gaps to a learning route','Daripada jurang Job description kepada laluan pembelajaran')}</h2><p>${tr('HR 卡片和求职者页面使用同一个技能对照函数。HR 只能看到主动授权申请中的技能和例子，不能读取私人学习进度。Job description 的技能要求更新后，两边重新按新要求计算。没有记录表示待补充，不代表申请者不会。','HR cards and job-seeker pages use the same skill comparison. HR sees only skills and examples shared in an authorised application, not private learning progress. Updated Job description skills update both comparisons. Missing records are open questions, not proof of inability.','Kad HR dan halaman pencari kerja menggunakan perbandingan kemahiran sama. HR hanya melihat kemahiran dan contoh dalam permohonan dibenarkan, bukan kemajuan pembelajaran peribadi. Perubahan kemahiran Job description mengemas kini kedua-dua perbandingan. Rekod tiada bukan bukti ketidakupayaan.')}</p><p>${tr('学习路线按 Job description 中尚未记录的技能选择：列出学习主题、模拟作品、复核方式及相关官网资源；未知自定义技能先向 HR 澄清任务和程度。只在关联明确时提供可选考试或资格路径，不把课程证书当作执业许可。按官网核对报名条件、费用和现行大纲。','Learning routes follow unrecorded Job description skills: topics, fictional work samples, review criteria and official resources. Unknown custom skills first need task and level clarification from HR. Optional credentials appear only where relevant; course certificates are not professional licences. Check official eligibility, fees and current syllabuses.','Laluan pembelajaran mengikut kemahiran Job description belum direkodkan: topik, sampel kerja rekaan, kriteria semakan dan sumber rasmi. Kemahiran tersuai perlu penjelasan tugas dan tahap daripada HR. Kelayakan pilihan hanya ditawarkan jika berkaitan; sijil kursus bukan lesen profesional. Semak syarat, yuran dan sukatan rasmi.')}</p><p>${tr('学习清单按账号、职位和技能分别保存。勾选完成只记录进度，不会自动把缺项改成已掌握或提高 Job description 覆盖率。新增经历应由本人核对，再在申请时主动分享。','Learning steps are saved separately by account, job and skill. Checking a step records progress; it does not certify mastery or increase Job description coverage. Review new experience yourself before choosing to share it in an application.','Langkah disimpan berasingan mengikut akaun, jawatan dan kemahiran. Menanda langkah merekod kemajuan, bukan mengesahkan penguasaan atau menaikkan liputan Job description. Semak pengalaman baharu sebelum memilih untuk berkongsi dalam permohonan.')}</p></section><section class="application-card"><h2>${tr('参考与边界','Sources & boundaries','Sumber & batasan')}</h2><ul><li><a href="https://www.onetcenter.org/content.html" target="_blank" rel="noopener">O*NET Content Model</a> · ${tr('职业与技能结构','Occupation and skill structure','Struktur pekerjaan dan kemahiran')}</li><li><a href="https://business.linkedin.com/hire/resources/talent-acquisition/adopting-skills-based-hiring" target="_blank" rel="noopener">LinkedIn · Skills-based hiring</a> · ${tr('区分必要技能与可培训技能','Separate essential and trainable skills','Bezakan kemahiran penting dan boleh dilatih')}</li><li><a href="https://www.linkedin.com/business/talent/blog/talent-acquisition/how-to-conduct-effective-skills-based-interview" target="_blank" rel="noopener">LinkedIn · Skills-based interviews</a> · ${tr('结构化问题与工作样本','Structured questions and work samples','Soalan berstruktur dan sampel kerja')}</li><li><a href="research.html">${tr('测评与游戏研究说明','Assessment and game research','Penyelidikan penilaian dan permainan')}</a></li></ul><p>${tr('以上资料支持设计方向，不代表它们验证了 Future Fit 的自定权重。权重需要后续本地样本验证、可访问性评估及公平性测试。比赛版只使用合成资料。','These sources inform the design; they do not validate Future Fit’s custom weights. Local validation, accessibility evaluation and fairness testing are still needed. The competition build uses synthetic profiles only.','Sumber ini memaklumkan reka bentuk, bukan mengesahkan wajaran Future Fit. Pengesahan tempatan, penilaian akses dan ujian keadilan masih diperlukan. Versi pertandingan menggunakan profil sintetik sahaja.')}</p></section>`;}render();window.addEventListener('aligna-locale-render',render);
</script></body></html>
