<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Fit · Method</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="assessment.css"><body data-page="library"><main id="assessment"></main><script src="shared.js"></script><script type="module">
import {copy} from './copy-v2.js';let lang=localStorage.getItem('aligna-lang')||'zh';const texts={zh:['问题怎样接着问？','目前使用「证据驱动的自适应选题规则」，不是已训练的机器学习，也不是经过 IRT 校准的 CAT。','01 · 先铺开','前 18 题覆盖六类兴趣，再询问人格、技能、工作偏好与职业探索。','02 · 再追问','每次回答后重算：尚未覆盖的方面、回答分散的方面，以及候选职业之间要求不同的技能，优先继续了解。你确认用过的技能会提高相关追问优先级。','03 · 给出依据','先完成 30 题，可每次再增加 10 题，最多 60 题。题库共有 151 道不同题目；题量不代表测量精度。','哪些信息会用在哪里？','确认技能用于追问；简历经历、教育和目标随记录保存，目前不自动评分。兴趣与技能用于探索职业；人格、偏好、情境分别呈现。游戏单独记录，不进入职业排序。','怎样验证？','代码检查覆盖去重、反向题、题量和职业排序；专业测量仍需目标人群试测、信效度研究、译文校准、公平性与重测研究。不能保证 30 题完整测出所有特质，更不能从矛盾答案判断撒谎。','来源'],en:['How does the next question get chosen?','The current system uses evidence-driven adaptive routing rules. It is not trained machine learning or IRT-calibrated CAT.','01 · Explore broadly','The first 18 questions cover six interest areas, personality, skills, preferences and career exploration.','02 · Follow the evidence','After every answer, priorities are recalculated from coverage gaps, response variation and skills that distinguish career options. Confirmed profile skills receive a follow-up priority boost.','03 · Show the evidence','Start with 30 questions and optionally add 10 at a time, up to 60. The bank contains 151 distinct items. More items do not by themselves establish precision.','Where does each input go?','Confirmed skills guide follow-ups. Experience, education and goals are saved, not automatically scored. Interests and skills inform career exploration; personality, preferences and scenarios are separate. Games do not change rankings.','What has been validated?','Code checks cover unique items, reverse scoring, session length and ranking. Measurement still needs target-population pilots, reliability, validity, translation, fairness and retest studies. Thirty mixed questions cannot fully measure every trait; inconsistent answers do not establish deception.','Sources'],ms:['Bagaimana soalan seterusnya dipilih?','Sistem menggunakan peraturan pemilihan adaptif berasaskan bukti. Bukan pembelajaran mesin terlatih atau CAT yang dikalibrasi melalui IRT.','01 · Terokai secara luas','18 soalan awal meliputi enam bidang minat, personaliti, kemahiran, keutamaan dan penerokaan kerjaya.','02 · Ikut bukti','Selepas setiap jawapan, keutamaan dikira semula berdasarkan jurang liputan, variasi jawapan dan kemahiran yang membezakan pilihan kerjaya. Kemahiran profil yang disahkan diberi keutamaan susulan.','03 · Tunjukkan bukti','Mulakan dengan 30 soalan, tambah 10 setiap kali hingga 60. Bank mempunyai 151 item berbeza. Bilangan item tidak membuktikan ketepatan.','Bagaimana maklumat digunakan?','Kemahiran disahkan memandu susulan. Pengalaman, pendidikan dan matlamat disimpan tanpa skor automatik. Minat dan kemahiran menyokong penerokaan kerjaya; personaliti, keutamaan dan situasi berasingan. Permainan tidak mengubah kedudukan.','Apa yang disahkan?','Semakan kod meliputi item unik, skor songsang, bilangan soalan dan kedudukan. Pengukuran masih memerlukan kajian rintis, kebolehpercayaan, kesahan, terjemahan, keadilan dan ujian semula. 30 soalan campuran tidak mengukur semua sifat sepenuhnya; percanggahan tidak membuktikan penipuan.','Sumber']};function render(){const t=texts[lang],c=copy[lang];document.querySelector('main').innerHTML=`<h1>${t[0]}</h1><p>${t[1]}</p>${[2,4,6,8,10].map(i=>`<section class="card"><h2>${t[i]}</h2><p>${t[i+1]}</p></section>`).join('')}<h2>${c.mappingTitle}</h2><p>${c.mappingText}</p><p>${c.methodText}</p><h2>${t[12]}</h2><p><a href="https://www.onetcenter.org/database.html">O*NET 31.0</a> · <a href="https://www.onetcenter.org/license_tools.html">O*NET Tools License</a> · <a href="library.html">${c.bank}</a> · <a href="research.html">${c.research}</a></p><a href="assessment.html">${c.begin} →</a>`;}window.addEventListener('aligna-language',e=>{lang=e.detail;render()});render();
</script></body></html>
